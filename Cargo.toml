[package]
name = "mandelbrot_gpu"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.13.0"
bytemuck = "1.25.0"
eframe = { version = "0.35.0", features = ["wgpu"] }
egui = "0.35.0"
egui-wgpu = "0.35.0"
env_logger = "0.11.11"
log = "0.4.33"
measure_time = "0.9.0"
wgpu = { version = "29.0.3", features = ["webgpu"] }
mimalloc = "0.1.52"

[profile.release]
lto = true
codegen-units = 1
